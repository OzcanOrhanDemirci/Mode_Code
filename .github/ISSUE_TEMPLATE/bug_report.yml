name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting. For security problems, use the private report instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mode-code doctor`
      description: It contains no personal data, but please look it over before pasting.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: mode-code, Claude Code, Node.js, operating system
      placeholder: 0.1.0 · Claude Code 2.1.296 · Node 24.15 · Windows 11
    validations:
      required: true
