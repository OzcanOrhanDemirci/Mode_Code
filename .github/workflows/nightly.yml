name: Nightly

# What a push cannot show: the newest Claude Code release against this build, the property tests with a
# fresh seed and many more cases, and (weekly) mutation testing. A failure here is mailed to the owner.
on:
  schedule:
    - cron: '17 3 * * *' # every night
    - cron: '41 4 * * 0' # Sundays: mutation testing too
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude-code-latest:
    name: newest Claude Code · mod engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --global @anthropic-ai/claude-code@latest
      - run: claude --version
      - run: npm run test:mod

  properties:
    name: property tests · fresh seed
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # The seed is printed first: a failure is replayed with TC_SEED=<seed> TC_RUNS=50000 npm test.
      - name: properties (seed ${{ github.run_id }})
        env:
          TC_SEED: ${{ github.run_id }}
          TC_RUNS: '50000'
        run: node --import tsx --test --test-reporter=spec test/properties/core.test.ts test/tui/widths.test.tsx

  mutation:
    name: mutation testing
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '41 4 * * 0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: node scripts/mutate.mjs --workers 4
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: coverage/mutation.txt
          if-no-files-found: ignore
