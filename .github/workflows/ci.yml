name: CI

# Actions minutes are counted on a private repository (a Windows minute as two), and a month's were spent in two
# days of frequent pushes (2026-10). So while the repository is private a push runs the newest Node on Linux and
# Windows; Node.js 22 and the rename rehearsal run at night when something changed (nightly.yml), and on pull
# requests and on demand. A push that changes only documentation runs at night too. Public, all of it runs here.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ${{ fromJSON(github.event.repository.private && github.event_name == 'push' && '["24.x"]' || '["22.x", "24.x"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      # The build comes first: tests also run the shipped hook program and installer from dist/.
      - run: npm run build
      # One job also measures coverage, held to the per-file floors in test/coverage-floors.json.
      - run: ${{ matrix.os == 'windows-latest' && matrix.node == '24.x' && 'npm run test:coverage' || 'npm test' }}
      # The tarball npm would publish, installed into an empty prefix and run through npm's launcher (L12).
      - run: npm run test:package
      - if: ${{ always() && matrix.os == 'windows-latest' && matrix.node == '24.x' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/report.txt
            coverage/coverage.txt
          if-no-files-found: ignore

  # A rename, rehearsed: today's build installed, a renamed copy built, tested and installed over it (docs/release.md).
  rename:
    name: rename rehearsal · ubuntu-latest · Node 24.x
    if: ${{ !github.event.repository.private || github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:rename

  # Secrets in any commit, read by a tool that is not ours (the project's own scanner checks what ships).
  secrets:
    name: secrets in history · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1, checksum verified
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  # macOS minutes are expensive on private repositories: there it runs on demand; on a public repository on every change.
  macos:
    name: macos-latest · Node 24.x
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:package
