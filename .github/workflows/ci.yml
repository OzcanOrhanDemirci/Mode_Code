name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      # The build comes first: tests also run the shipped hook program and installer from dist/.
      - run: npm run build
      # One job also measures coverage, held to the per-file floors in test/coverage-floors.json.
      - run: ${{ matrix.os == 'windows-latest' && matrix.node == '24.x' && 'npm run test:coverage' || 'npm test' }}
      - if: ${{ always() && matrix.os == 'windows-latest' && matrix.node == '24.x' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/report.txt
            coverage/coverage.txt
          if-no-files-found: ignore

  # macOS minutes are expensive on private repositories: there it runs on demand; on a public repository on every change.
  macos:
    name: macos-latest · Node 24.x
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
